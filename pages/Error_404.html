<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/images/tab_icon.webp">
  <title>Erro 404 | Page not Found</title>
</head>

<body>
  <style>
    * {
      padding: 0;
      margin: 0;
    }

    body {
      background-image: radial-gradient(#00d1ff, #0465b0);
      height: 98.4vh;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5vw;
      font-family: 'Alkatra';
      user-select: none;
    }

    img {
      width: 30vh;
    }

    div {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #FF921A;
      text-shadow: 1px 1px 0 black;
    }

    h1 {
      font-size: 20vh;
      line-height: 0.8;
    }

    p {
      font-size: 3em;
    }

    @media only screen and (max-width: 600px) {
      body {
        flex-direction: column;
        gap: 5vh;
      }

      h1 {
        font-size: 30vw;
      }

      p {
        font-size: 8vw;
      }
    }
  </style>
  <img src="/images/Error_404.webp" alt="">
  <div>
    <h1>404</h1>
    <p>Page not Found</p>
  </div>
</body>

</html>
